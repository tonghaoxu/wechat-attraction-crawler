# ============================================================
# 微信公众号景点爬虫配置
# ============================================================

# 凭证：登录 https://mp.weixin.qq.com 后获取（见 README.md 第 2 步）
credentials:
  token: ""        # 登录后地址栏 URL 里的 token=xxxxxx
  cookie: ""       # F12 -> Network -> 任意请求 -> Request Headers -> Cookie 整串复制

crawl:
  pages_per_account: 1    # 每个公众号抓几页文章列表（每页 5 篇），只要最新内容设 1 即可
  min_delay: 12           # 两次请求之间的最小间隔（秒），不要调低，容易被冻结
  max_delay: 25           # 最大间隔（秒）
  fetch_content: true     # 是否抓取文章正文（false 则只存标题/链接/摘要）
  max_age_days: 90        # 只抓最近 N 天内发布的文章，0 = 不限时间

  # 游客相关性过滤：只保留影响出行的公告（开闭园/票价/临时闭馆/交通/天气等），
  # 过滤掉招聘、党建、文创带货、活动宣传等对游客无用的内容。
  # 在抓正文之前基于标题+摘要判断，能大幅减少无效请求。
  filter:
    enabled: true
    # 下面留空则使用 wechat_crawler/filter.py 里的内置默认词表；
    # 如需定制，可在此追加/覆盖（填了就完全替换默认词表）。
    include_keywords: []
    exclude_keywords: []

storage:
  db_path: data/articles.db
  export_dir: data/export

# HTTP API 服务（python -m wechat_crawler serve）
# 供 Telegram Bot / 微信客服 / 官网等多平台统一取数
api:
  host: 0.0.0.0
  port: 8000
  # 为每个接入平台各发一个 key（请求头 X-API-Key）。留空 = 不鉴权（仅限本机调试）
  api_keys:
    - ""   # 例如: tg-bot-xxxxxxxx
  # 允许跨域的来源（官网前端直接调用时填官网域名）；["*"] 表示不限制
  cors_origins:
    - "*"

